[project]
name = "pokemon"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2.5",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "faker>=37.11.0",
    "ipython>=9.5.0",
    "pytest-django>=4.11.1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "main.settings"
addopts = "-p no:warnings"
