version = "0.1.13"
slug = "supertodo"
bundle = [ "/docs/README.pdf", "/tests", "/fixtures", "/factories", "/.gitignore", "/pyproject.toml", "/uv.lock", "/justfile", "/pytest.ini",]
backup_on_update = [ "justfile",]
exclude_from_zip = [ "*.pyc", ".DS_Store", "/.git", "*.bak", ".venv", ".env", "*cache*", "/args.py",]
delete_on_update = [ "pytest.ini",]
test_cmd = "uv run pytest"

