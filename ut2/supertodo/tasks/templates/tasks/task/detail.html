{% extends "base.html" %}

{% block content %}
<article class="task-detail">
  <h2>{{ task.name }}</h2>
  <p class="task-state">{% if task.completed %}Completada{% else %}Pendiente{% endif %}</p>
  <p>{{ task.description|default:"Sin descripción."|linebreaksbr }}</p>
</article>
<a href="{% url 'tasks:task-list' %}">Volver</a>
{% endblock %}
