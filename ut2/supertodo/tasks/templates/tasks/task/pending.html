{% extends "base.html" %} {% block content %}
<p>Número de tareas: {{ total_tasks }}</p>
{% for task in pending_list %}
<h3>
  <a href="{% url 'tasks:task-detail' task.slug %}"> {{ task }}: ❌</a>
</h3>

{% empty %}
<p>Nada que hacer. ¡Enhorabuena!</p>

{% endfor %}
<a href="{% url 'tasks:task-list' %}"> Volver</a>
{% endblock %}
