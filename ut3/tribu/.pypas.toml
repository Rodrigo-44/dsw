version = "0.1.9"
slug = "tribu"
bundle = [ "/docs/README.pdf", "/tests", "/fixtures", "/factories", "/media/avatars/example*.jpg", "/media/avatars/noavatar.png", "/.gitignore", "/pyproject.toml", "/uv.lock", "/justfile", "/pytest.ini",]
backup_on_update = [ "justfile",]
delete_on_update = [ "pytest.ini",]
exclude_from_zip = [ "*.pyc", ".DS_Store", "/.git", "*.bak", ".venv", ".env", "*cache*", "/args.py",]
test_cmd = "uv run pytest"

