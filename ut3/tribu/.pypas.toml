"0.1.3" = "Corrige errores menores en justfile y README"
"0.1.4" = "Añade score a los tests"
"0.1.5" = "Añade receta para obtener el score de los tests"
"0.1.6" = "Ignora args.py al comprimir ejercicio"
"0.1.7" = "Refactoriza recetas justfile para tests"
"0.1.8" = "Añade comprobación de migraciones antes de test-core"
"0.1.9" = "Corrige enlaces aprendepython.es"
