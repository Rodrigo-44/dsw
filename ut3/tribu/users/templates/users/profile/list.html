{% extends "base.html" %} {% block content %}

<h2>Users</h2>

<ul>
  {% for profile in profiles %}
  <li>
    <a href="{% url 'users:user-detail' profile.user.username %}">
      {{ profile.user.username }}
    </a>
  </li>
  {% empty %}
  <li>No users yet.</li>
  {% endfor %}
</ul>

{% endblock content %}
